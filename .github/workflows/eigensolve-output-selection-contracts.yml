name: eigensolve-output-selection-contracts

on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths:
      - 'crates/fullmag-runner/src/eigen/output_selection.rs'
      - 'crates/fullmag-runner/src/fem/eigen_output.rs'
      - 'crates/fullmag-runner/src/fem/eigen_path.rs'
      - 'crates/fullmag-runner/src/fem/eigen_execution.rs'
      - 'crates/fullmag-runner/src/fem/eigen_native_artifacts.rs'
      - 'crates/fullmag-runner/src/fem/eigen_native_window.rs'
      - 'crates/fullmag-runner/src/fem/eigen_tests.rs'
      - '.github/workflows/eigensolve-output-selection-contracts.yml'

permissions:
  contents: read

jobs:
  modal-field-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Preserve exact source identity
        run: git rev-parse HEAD
      - name: Run output selection contracts
        run: cargo test --locked -p fullmag-runner --lib eigen::output_selection::tests -- --nocapture
      - name: Run actual single-sample writer contract
        run: |
          cargo test --locked -p fullmag-runner --lib fem::eigen_tests::native_eigen_v2_mode_metadata_preserves_operator_provenance -- --exact --nocapture | tee "$RUNNER_TEMP/modal-single-writer.log"
          rg -F "test fem::eigen_tests::native_eigen_v2_mode_metadata_preserves_operator_provenance ... ok" "$RUNNER_TEMP/modal-single-writer.log"
      - name: Run actual tracked bias aggregation contract
        run: |
          cargo test --locked -p fullmag-runner --lib fem::eigen_path::test_support::bias_field_branch_selection_tracks_native_publisher_artifacts_before_publication -- --exact --nocapture | tee "$RUNNER_TEMP/modal-tracked-writer.log"
          rg -F "test fem::eigen_path::test_support::bias_field_branch_selection_tracks_native_publisher_artifacts_before_publication ... ok" "$RUNNER_TEMP/modal-tracked-writer.log"
