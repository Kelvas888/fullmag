name: eigensolve-api-source-contracts

on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths:
      - '.github/workflows/eigensolve-api-source-contracts.yml'
      - 'crates/fullmag-api/src/session.rs'
      - 'crates/fullmag-api/src/router_v2/tests.rs'
      - 'crates/fullmag-api/src/router_v2/handlers/data/fields.rs'
      - 'crates/fullmag-api/src/router_v2/handlers/data/quantities.rs'
      - 'crates/fullmag-api/src/router_v2/handlers/analysis/results.rs'

permissions:
  contents: read

jobs:
  physical-field-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Preserve exact source identity
        run: git rev-parse HEAD
      - name: Run session ownership and physical field contracts
        run: cargo test --locked -p fullmag-api --bin fullmag-api session::tests --no-fail-fast
      - name: Preserve dataset source paths and byte revisions
        run: |
          set -o pipefail
          cargo test --locked -p fullmag-api --bin fullmag-api router_v2::handlers::analysis::results::tests -- --nocapture | tee "$RUNNER_TEMP/result-datasets.log"
          grep -F "multi_stage_hysteresis_manifests_preserve_resolved_source_paths_and_revisions ... ok" "$RUNNER_TEMP/result-datasets.log"
          grep -F "resolved_hysteresis_source_ref_rejects_parent_components ... ok" "$RUNNER_TEMP/result-datasets.log"
      - name: Run older callback magnetization publication contract
        run: cargo test --locked -p fullmag-api --bin fullmag-api router_v2::tests::v2_older_runtime_m_frame_preserves_newer_selected_source_and_bundle -- --exact
      - name: Run physical row and bundle consistency contract
        run: cargo test --locked -p fullmag-api --bin fullmag-api router_v2::tests::v2_m_publication_bundle_requires_matching_physical_scalar_row -- --exact
      - name: Run solver progress stale field contract
        run: |
          cargo test --locked -p fullmag-api --bin fullmag-api router_v2::tests::v2_progress_keeps_live_magnetization_at_its_original_observation_step -- --exact | tee "$RUNNER_TEMP/field-freshness.log"
          grep -F "test router_v2::tests::v2_progress_keeps_live_magnetization_at_its_original_observation_step ... ok" "$RUNNER_TEMP/field-freshness.log"
