# Overlay for the v2 frontend development named volumes.
#
# The selected Compose group owns these external volumes.  The source checkout
# remains mounted readonly by compose.dev.yaml; this overlay owns only the
# generated workspace/dependency/cache state.  No host storage path, ext4
# image, loop mount, or maintenance container is part of the active route.
# Docker seeds a new empty state volume from the image-owned
# /state/development directory. The root-only backend cache maintenance step
# provisions the `frontend` subpath before Compose mounts it here. The frontend
# cannot see backend build provenance through this restricted volume mount.
services:
  frontend:
    image: "${FULLMAG_FRONTEND_CACHE_RUNTIME_IMAGE_ID:?Attested image identity is required}"
    pull_policy: never
    labels:
      com.fullmag.frontend-cache.profile: "${FULLMAG_FRONTEND_CACHE_PROFILE:?Resolve frontend-cache-v2 first}"
      com.fullmag.frontend-cache.key: "${FULLMAG_FRONTEND_CACHE_KEY:?Resolved cache key is required}"
    environment:
      FULLMAG_FRONTEND_CACHE_SCHEMA: "${FULLMAG_FRONTEND_CACHE_SCHEMA:?Resolve frontend-cache-v2 first}"
      FULLMAG_FRONTEND_CACHE_PROFILE: "${FULLMAG_FRONTEND_CACHE_PROFILE:?Resolve frontend-cache-v2 first}"
      FULLMAG_FRONTEND_CACHE_PROJECT_ID: "${FULLMAG_FRONTEND_CACHE_PROJECT_ID:?Resolved cache project id is required}"
      FULLMAG_FRONTEND_CACHE_KEY: "${FULLMAG_FRONTEND_CACHE_KEY:?Resolved cache key is required}"
      FULLMAG_FRONTEND_CACHE_VOLUME: "${FULLMAG_FRONTEND_CACHE_VOLUME:?Resolved frontend state volume is required}"
      FULLMAG_BUILD_CONTROL_VOLUME: "${FULLMAG_BUILD_CONTROL_VOLUME:?Resolved shared control volume is required}"
      # The launcher derives both paths from the v2 cache key.  Do not fall
      # back to a shared manifest: the control volume is shared by services,
      # while each frontend state volume owns one cache-key namespace.
      FULLMAG_FRONTEND_CONTROL_ROOT: "${FULLMAG_FRONTEND_CONTROL_ROOT:?Resolved frontend control namespace is required}"
      FULLMAG_DEVELOPMENT_INPUTS_PATH: "${FULLMAG_DEVELOPMENT_INPUTS_PATH:?Resolved frontend inputs path is required}"
      FULLMAG_FRONTEND_CACHE_RUNTIME_IMAGE_ID: "${FULLMAG_FRONTEND_CACHE_RUNTIME_IMAGE_ID:?Attested image identity is required}"
    volumes:
      - type: volume
        source: frontend-development-state
        target: /state/development
        read_only: false
      - type: volume
        source: fullmag-build-control
        target: /opt/fullmag/control
        read_only: false
        volume: {nocopy: true, subpath: frontend}

volumes:
  frontend-development-state:
    name: "${FULLMAG_FRONTEND_CACHE_VOLUME:?Resolved frontend state volume is required}"
    external: true
  fullmag-build-control:
    name: "${FULLMAG_BUILD_CONTROL_VOLUME:?Resolved shared control volume is required}"
    external: true
