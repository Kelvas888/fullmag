# Fullmag development on Docker Desktop. Sources stay in the selected checkout.
# The direct development launcher resolves paths, builds inside the backend
# service on request, checks Windows storage and records the resolved config.
name: fullmag

services:
  backend:
    image: ${FULLMAG_DEV_IMAGE:?Prepare the development toolchain image}
    build:
      context: ./docker/all-in-one
      dockerfile: Dockerfile.backend
      args:
        DEV_BASE: ${FULLMAG_DEVELOPMENT_BASE_IMAGE:-fullmag/development-base:local}
    pull_policy: never
    init: true
    user: "65532:65532"
    read_only: true
    gpus: all
    cpus: 4
    mem_limit: 8g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    hostname: ${FULLMAG_BACKEND_HOSTNAME:?Managed run hostname is required}
    environment:
      FULLMAG_DOCKER_ROLE: backend
      FULLMAG_SESSION_STORAGE_PROFILE: windows-folder-v1
      FULLMAG_RUNTIME_IMAGE_ID: ${FULLMAG_DEV_IMAGE}
    expose: ["8081"]
    volumes:
      # One source selection for both services: the main checkout or a worktree.
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT:?Select the Windows source checkout}
        target: /opt/fullmag/source
        read_only: true
        bind: {create_host_path: false}
      # Compiled backend output, not a Windows executable or source copy.
      - type: bind
        source: ${FULLMAG_BACKEND_PACKAGE:?Build the backend inside its Compose service}
        target: /opt/fullmag/package
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_PACKAGE_PROVENANCE:?Backend build provenance is required}
        target: /opt/fullmag/provenance.json
        read_only: true
        bind: {create_host_path: false}
      # Real Windows storage: sessions, results, logs and the CUDA disk cache.
      - type: bind
        source: ${FULLMAG_STATE_ROOT:?Managed Windows storage namespace is required}
        target: /state
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_HOST_CERTIFICATE:?Windows storage admission is required}
        target: /run/fullmag/windows-folder-host.json
        read_only: true
        bind: {create_host_path: false}
    tmpfs: ["/tmp:rw,nosuid,nodev,size=512m"]
    networks: [fullmag]

  frontend:
    image: ${FULLMAG_DEV_IMAGE}
    pull_policy: never
    init: true
    user: "65532:65532"
    read_only: true
    cpus: 2
    mem_limit: 6g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    depends_on:
      # The shell must remain reachable while backend admission is closed or
      # its health probe is failing; API requests still use the private proxy.
      backend: {condition: service_started}
    environment:
      FULLMAG_DOCKER_ROLE: frontend
      FULLMAG_DOCKER_FRONTEND: dev
      FULLMAG_API_PROXY_TARGET: http://backend:8081
      FULLMAG_WATCHPACK_POLLING_MS: ${FULLMAG_WATCHPACK_POLLING_MS:-2000}
      HOME: /state/development
      NVIDIA_VISIBLE_DEVICES: void
    ports: ["127.0.0.1:${FULLMAG_HTTP_PORT:-3197}:8080"]
    volumes:
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT:?Select the Windows source checkout}
        target: /opt/fullmag/source
        read_only: true
        bind: {create_host_path: false}
      # Linux dependencies, Next output and HMR logs stay out of the checkout.
      # The frontend-cache-v1 overlay replaces only the four Linux cache/dependency
      # children below; the Windows state bind remains the owner of sessions, logs
      # and receipts.
      - type: bind
        source: ${FULLMAG_STATE_ROOT}/development
        target: /state/development
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_DEVELOPMENT_INPUTS:?Prepare the frontend input manifest}
        target: /run/fullmag/development-inputs.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT}/apps/control-room/app
        target: /state/development/workspace/apps/control-room/app
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT}/apps/control-room/src
        target: /state/development/workspace/apps/control-room/src
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT}/apps/control-room/public
        target: /state/development/workspace/apps/control-room/public
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FULLMAG_SOURCE_ROOT}/apps/control-room/scripts
        target: /state/development/workspace/apps/control-room/scripts
        read_only: true
        bind: {create_host_path: false}
    tmpfs: ["/tmp:rw,nosuid,nodev,size=512m"]
    healthcheck:
      # Two 120s tool probes + 60m frozen install + 60s Next startup margin.
      start_period: 3900s
    networks: [fullmag]

# A separate project-scoped bridge; no external networks, static IPs or host mode.
networks:
  fullmag:
    driver: bridge
